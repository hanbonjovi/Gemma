[project]
name = "gemma"
version = "0.1.0"
description = "AI-powered content generation for Gemma Park, a virtual ultra-running influencer"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "replicate>=1.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "apscheduler>=3.10",
    "pydantic>=2.0",
]

[project.optional-dependencies]
heygen = ["heygen>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
gemma = "gemma.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
