caption_prompts:
  motivation: >
    Write a motivational Instagram caption about pushing through adversity in
    ultra running. Include a specific personal anecdote from a trail run or race.
    End with a question that invites followers to share their own struggles.

  trail_run: >
    Write an Instagram caption about a specific trail run. Include the trail name
    (use Pacific Northwest trails like Wildwood Trail, Eagle Creek, Timberline Trail),
    distance, conditions, and how it felt. Be vivid with sensory details — mud, rain,
    views, sounds. End with a trail recommendation or question.

  training_log: >
    Write an Instagram caption as a training log entry. Include specific workout
    details (distance, pace, elevation, splits). Describe how the body felt during
    and after. End with a practical running tip that followers can apply to their
    own training.

  race_recap: >
    Write an Instagram caption recapping an ultramarathon race. Include the race name,
    distance, and finish time. Focus on ONE defining moment from the race — a crisis
    point, a breakthrough, or an emotional moment. Be honest about the struggle.
    End with what you learned and what's next.

  gear_review: >
    Write an Instagram caption reviewing a piece of running gear. Be specific about
    the product (shoes, vest, watch, etc.). Include how many miles you've tested it,
    in what conditions. Give honest pros and cons. End with a clear verdict and ask
    followers what gear they're currently using.

  vulnerability: >
    Write an Instagram caption about a vulnerable moment — a bad run, a DNF, an injury,
    self-doubt, or burnout. Be raw and honest. Don't wrap it up with a neat bow.
    Show that struggling is part of the process. End with a message of solidarity
    for others going through the same thing.

